<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cửa hàng linh kiện</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Cửa hàng linh kiện</h1>

  <h2>Sản phẩm</h2>
  <div id="danh-sach-san-pham"></div>

  <h2>Giỏ hàng</h2>
  <div id="gio-hang"></div>

<!-- Form đặt hàng -->
<form id="form-dat-hang">
  <h3>Thông tin giao hàng</h3>
  <div class="form-group">
    <label for="ten">Họ và tên:</label>
    <input type="text" id="ten" required autocomplete="name" placeholder="Nhập họ tên của bạn">
  </div>
  <div class="form-group">
    <label for="sdt">Số điện thoại:</label>
    <input type="tel" id="sdt" required autocomplete="tel" pattern="(0|\+84)\d{9,10}" placeholder="Ví dụ: 0900000000">
  </div>
  <div class="form-group">
    <label for="diaChi">Địa chỉ giao hàng:</label>
    <input type="text" id="diaChi" required autocomplete="street-address" placeholder="Nhập địa chỉ nhận hàng">
  </div>
  <button type="submit" id="btn-dat-hang">Xác nhận đặt hàng</button>
  <p id="thong-bao"></p>
</form>

  <script src="script.js"></script>
</body>
</html>
